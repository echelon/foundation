<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foundation API</title>
<style>
  :root {
    --bg: #0b0d13;
    --fg: #e8eaf2;
    --muted: #9aa1b5;
    --card: rgba(255, 255, 255, 0.04);
    --border: rgba(255, 255, 255, 0.1);
    --brand-a: #7c6cff;
    --brand-b: #ff5ea8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 16px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  #sky { position: fixed; inset: 0; display: block; cursor: crosshair; }
  main {
    position: relative;
    z-index: 1;
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 24px;
    pointer-events: none; /* let clicks fall through to the canvas… */
  }
  .card {
    pointer-events: auto; /* …except on the card itself */
    max-width: 34rem;
    text-align: center;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 40px 36px 32px;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
  }
  .badge {
    display: inline-block;
    font: 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 12px;
    margin-bottom: 20px;
    letter-spacing: 0.04em;
  }
  h1 {
    font-size: clamp(1.9rem, 5vw, 2.6rem);
    font-weight: 800;
    letter-spacing: -0.02em;
    margin-bottom: 10px;
  }
  h1 .grad, .rust {
    background: linear-gradient(100deg, var(--brand-a), var(--brand-b));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .sub { color: var(--muted); }
  .sub strong { color: var(--fg); }
  code {
    font: 0.9em ui-monospace, SFMono-Regular, Menlo, monospace;
    background: rgba(255, 255, 255, 0.07);
    border-radius: 6px;
    padding: 2px 7px;
  }
  nav { display: flex; justify-content: center; gap: 10px; margin: 26px 0 22px; flex-wrap: wrap; }
  nav a {
    color: var(--fg);
    text-decoration: none;
    font-weight: 600;
    font-size: 14px;
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 9px 18px;
    transition: border-color 0.15s, transform 0.15s, background 0.15s;
  }
  nav a:hover {
    border-color: var(--brand-a);
    background: rgba(124, 108, 255, 0.12);
    transform: translateY(-1px);
  }
  .hiring { font-size: 15px; color: var(--muted); }
  .hiring a { color: var(--fg); font-weight: 600; text-decoration: none; border-bottom: 1px solid var(--brand-b); }
  .hiring a:hover { color: var(--brand-b); }
  .hint {
    margin-top: 18px;
    font-size: 13px;
    color: var(--muted);
    opacity: 0.85;
  }
  #score { color: var(--fg); font-weight: 700; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) {
    nav a { transition: none; }
  }
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main>
  <div class="card">
    <div class="badge">api.foundation.ai</div>
    <h1>Hello, human <span class="grad">👋</span></h1>
    <p class="sub">
      You've reached the <strong>Foundation</strong> API gateway — generative media and LLMs
      behind one clean API. The interesting endpoints live under <code>/v1</code>.
    </p>
    <nav>
      <a href="https://foundation.ai">Website</a>
      <a href="https://discord.gg/foundation">Discord</a>
      <a href="https://github.com/foundation-ai">GitHub</a>
    </nav>
    <p class="hiring">
      P.S. — we're hiring <span class="rust">Rust</span> engineers.
      <a href="https://foundation.ai/careers">Come build with us →</a>
    </p>
    <p class="hint" id="hint">Bored? Pop the orbs floating around this card. <span id="score"></span></p>
  </div>
</main>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("sky");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const hintEl = document.getElementById("hint");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

  let W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = canvas.width = innerWidth * DPR;
    H = canvas.height = innerHeight * DPR;
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
  }
  addEventListener("resize", resize);
  resize();

  // ── The orbs (the game) ──
  const ORB_COUNT = 8;
  const orbs = [];
  const bursts = [];
  let score = 0;

  function spawnOrb(delay = 0) {
    orbs.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: (14 + Math.random() * 16) * DPR,
      vx: (Math.random() - 0.5) * 0.6 * DPR,
      vy: (Math.random() - 0.5) * 0.6 * DPR,
      hue: 230 + Math.random() * 110, // indigo → pink
      wait: delay, // frames until it materializes
      pulse: Math.random() * Math.PI * 2,
    });
  }
  for (let i = 0; i < ORB_COUNT; i++) spawnOrb();

  function pop(orb, idx) {
    orbs.splice(idx, 1);
    score++;
    scoreEl.textContent = "★ " + score;
    if (score === 10) hintEl.firstChild.textContent = "Okay, you're good at this. Maybe apply? ";
    if (!reduced) {
      for (let i = 0; i < 18; i++) {
        const a = (Math.PI * 2 * i) / 18;
        const sp = (1.5 + Math.random() * 2.5) * DPR;
        bursts.push({ x: orb.x, y: orb.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, hue: orb.hue });
      }
    }
    spawnOrb(reduced ? 0 : 40 + Math.random() * 60);
    if (reduced) draw(); // static mode repaints on interaction only
  }

  canvas.addEventListener("pointerdown", (e) => {
    const x = e.clientX * DPR, y = e.clientY * DPR;
    for (let i = orbs.length - 1; i >= 0; i--) {
      const o = orbs[i];
      if (o.wait <= 0 && (x - o.x) ** 2 + (y - o.y) ** 2 < (o.r * 1.6) ** 2) {
        pop(o, i);
        return;
      }
    }
  });

  // Gentle cursor repulsion so the field feels alive.
  let mx = -1e9, my = -1e9;
  canvas.addEventListener("pointermove", (e) => { mx = e.clientX * DPR; my = e.clientY * DPR; });

  function step() {
    for (const o of orbs) {
      if (o.wait > 0) { o.wait--; continue; }
      o.pulse += 0.03;
      const dx = o.x - mx, dy = o.y - my;
      const d2 = dx * dx + dy * dy;
      const reach = 130 * DPR;
      if (d2 < reach * reach && d2 > 1) {
        const d = Math.sqrt(d2), f = ((reach - d) / reach) * 0.25 * DPR;
        o.vx += (dx / d) * f;
        o.vy += (dy / d) * f;
      }
      o.vx *= 0.985; o.vy *= 0.985;
      o.x += o.vx; o.y += o.vy;
      if (o.x < -o.r) o.x = W + o.r;
      if (o.x > W + o.r) o.x = -o.r;
      if (o.y < -o.r) o.y = H + o.r;
      if (o.y > H + o.r) o.y = -o.r;
    }
    for (let i = bursts.length - 1; i >= 0; i--) {
      const p = bursts[i];
      p.x += p.vx; p.y += p.vy;
      p.vx *= 0.96; p.vy *= 0.96;
      p.life -= 0.03;
      if (p.life <= 0) bursts.splice(i, 1);
    }
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (const o of orbs) {
      if (o.wait > 0) continue;
      const r = o.r * (1 + (reduced ? 0 : Math.sin(o.pulse) * 0.12));
      const g = ctx.createRadialGradient(o.x, o.y, 0, o.x, o.y, r * 2.4);
      g.addColorStop(0, `hsla(${o.hue}, 90%, 72%, 0.9)`);
      g.addColorStop(0.4, `hsla(${o.hue}, 85%, 62%, 0.35)`);
      g.addColorStop(1, `hsla(${o.hue}, 85%, 60%, 0)`);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(o.x, o.y, r * 2.4, 0, Math.PI * 2);
      ctx.fill();
    }
    for (const p of bursts) {
      ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${p.life})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.4 * DPR * p.life, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  if (reduced) {
    draw(); // one static frame; clicks still pop and repaint
  } else {
    (function loop() {
      step();
      draw();
      requestAnimationFrame(loop);
    })();
  }
})();
</script>
</body>
</html>
