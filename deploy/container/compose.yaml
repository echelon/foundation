name: tokencraft-demo

services:
  demo:
    image: tokencraft-demo:local
    build:
      context: ../..
      dockerfile: deploy/container/Dockerfile
      target: demo
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:4000:14000"
    tmpfs:
      - /tmp:mode=1777,size=64m
    volumes:
      - demo-state:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "curl", "--noproxy", "*", "--fail", "--silent", "--max-time", "2", "http://127.0.0.1:14000/ready"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 15
    stop_grace_period: 25s

volumes:
  demo-state:
