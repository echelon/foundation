# HAProxy 3.2+. Run one private API pool per cell behind trusted HTTPS ingress.
global
    log stdout format raw local0
    maxconn "${TOKENCRAFT_LB_MAX_CONNECTIONS}"

defaults
    mode http
    log global
    log-format "status=%ST backend=%b replica=%s queue_ms=%Tw connect_ms=%Tc headers_ms=%Tr total_ms=%Ta termination=%tsc"
    timeout http-request 10s
    timeout http-keep-alive 15s
    timeout connect 2s
    timeout queue 4s
    timeout check 2s
    timeout client 120s
    timeout server 120s
    retries 0

resolvers cell_dns
    parse-resolv-conf
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s

frontend cell_ingress
    bind "${TOKENCRAFT_LB_BIND}"

    # The TLS ingress overwrites client-supplied forwarding headers.
    acl trusted_ingress src -f "${TOKENCRAFT_LB_TRUSTED_INGRESS_FILE}"
    http-request return status 403 unless trusted_ingress

    acl balancer_probe path /_tokencraft/ingress-ready
    acl probe_method method GET HEAD
    http-request return status 405 hdr Allow "GET, HEAD" if balancer_probe !probe_method
    http-request return status 503 if balancer_probe { nbsrv(cell_api) lt 1 }
    http-request return status 200 if balancer_probe

    acl single_client_ip req.hdr_cnt(X-Forwarded-For) eq 1
    acl parsed_client_ip req.hdr_ip(X-Forwarded-For) -m found
    http-request return status 400 unless single_client_ip parsed_client_ip
    http-request set-header X-Forwarded-For %[req.hdr_ip(X-Forwarded-For)]
    http-request set-header X-Forwarded-Proto https
    http-request del-header Forwarded
    default_backend cell_api

backend cell_api
    # Concurrent streams can stay open far longer than ordinary API reads.
    balance leastconn
    option httpchk
    http-check send meth GET uri /ready ver HTTP/1.1 hdr Host tokencraft-api
    http-check expect status 200
    default-server init-state fully-down inter 2s downinter 2s fall 3 rise 2 maxconn "${TOKENCRAFT_LB_CONNECTIONS_PER_API}"
    server-template api "${TOKENCRAFT_LB_API_SLOTS}" "${TOKENCRAFT_LB_API_ADDRESS}" check resolvers cell_dns init-addr none
