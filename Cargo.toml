[workspace]
resolver = "2"
members = [
  # ── core libraries (no DB, no HTTP) ──
  "crates/core/ids",
  "crates/core/money",
  "crates/core/config",
  "crates/core/catalog",
  # ── data layer ──
  "crates/db",
  # ── provider clients (pure HTTP) ──
  "crates/clients/client-core",
  "crates/clients/kinovi_client",
  "crates/clients/openai_client",
  "crates/clients/google_client",
  "crates/clients/anthropic_client",
  # data-layer query crate
  "crates/db-queries",
  # ── deployables ──
  "crates/bin/api-gateway",
  "crates/bin/admin-cli",
]

[workspace.package]
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
# runtime
tokio = { version = "1", features = ["full"] }
# data
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "migrate", "chrono", "json"] }
# web
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors"] }
# http client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
# serde
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ids / time / util
ulid = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
base64 = "0.22"
# errors / logging
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
# auth
argon2 = "0.5"
jsonwebtoken = "9"
rand = "0.8"
sha2 = "0.10"
hex = "0.4"

# internal
ids = { path = "crates/core/ids" }
money = { path = "crates/core/money" }
config = { path = "crates/core/config" }
catalog = { path = "crates/core/catalog" }
db = { path = "crates/db" }
client-core = { path = "crates/clients/client-core" }
kinovi_client = { path = "crates/clients/kinovi_client" }
openai_client = { path = "crates/clients/openai_client" }
google_client = { path = "crates/clients/google_client" }
anthropic_client = { path = "crates/clients/anthropic_client" }
db_queries = { path = "crates/db-queries" }

[profile.dev]
# faster incremental link on macOS
opt-level = 0
